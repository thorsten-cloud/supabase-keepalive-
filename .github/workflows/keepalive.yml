name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */3 * *'  # alle 3 Tage um 8:00 UTC
  workflow_dispatch:        # manuell auslösbar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPA_URL }}/rest/v1/leon_planer?id=eq.main&select=id" \
            -H "apikey: ${{ secrets.SUPA_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPA_KEY }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase ist aktiv"
          else
            echo "❌ Supabase antwortet nicht (Status $STATUS)"
            exit 1
          fi
